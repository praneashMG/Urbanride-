<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | UrbanRide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#15803D',
                        secondary: '#F59E0B'
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        .float-animation {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .spin-slow {
            animation: spin-slow 20s linear infinite;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 font-sans transition-colors min-h-screen flex flex-col text-gray-800 dark:text-gray-200">

    <!-- Minimal Header -->
    <header class="border-b border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 px-6 py-4 flex-shrink-0 transition-colors">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i class="fas fa-bicycle text-secondary text-2xl"></i>
                <span class="text-xl font-bold tracking-wider text-gray-900 dark:text-white">URBAN<span class="text-secondary">RIDE</span></span>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="document.body.classList.toggle('rtl'); document.documentElement.setAttribute('dir', document.body.classList.contains('rtl') ? 'rtl' : 'ltr')" class="bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 text-[10px] font-bold px-3 py-1.5 rounded border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 transition shadow-sm uppercase tracking-widest">
                    RTL
                </button>
                <button onclick="document.documentElement.classList.toggle('dark')" class="bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 w-8 h-8 rounded flex items-center justify-center border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 transition shadow-sm">
                    <i class="fas fa-moon text-xs"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex items-center justify-center px-4 py-12">
        <div class="max-w-2xl w-full text-center">
            <!-- Animated Bicycle Icon -->
            <div class="relative inline-block mb-8">
                <div class="absolute inset-0 bg-primary/10 dark:bg-primary/20 rounded-full blur-2xl scale-150"></div>
                <div class="relative float-animation">
                    <i class="fas fa-bicycle text-8xl text-secondary spin-slow"></i>
                </div>
            </div>

            <!-- 404 Text -->
            <h1 class="text-8xl md:text-9xl font-black text-gray-900 dark:text-white tracking-tight mb-4">404</h1>
            
            <!-- Message -->
            <h2 class="text-2xl md:text-3xl font-bold text-gray-800 dark:text-gray-200 mb-4">Oops! Route Not Found</h2>
            <p class="text-gray-600 dark:text-gray-400 text-base md:text-lg mb-8 max-w-md mx-auto">
                The page you're looking for has taken a different path. Let's get you back on track.
            </p>

            <!-- Action Buttons -->
            <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
                <a href="index.html" class="bg-primary hover:bg-green-700 text-white font-bold px-8 py-3 rounded-full transition shadow-md hover:shadow-lg flex items-center gap-2 text-sm uppercase tracking-wider">
                    <i class="fas fa-home"></i> Back to Home
                </a>
                <a href="#" onclick="history.back(); return false;" class="bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-800 dark:text-gray-200 font-bold px-8 py-3 rounded-full transition text-sm uppercase tracking-wider flex items-center gap-2">
                    <i class="fas fa-arrow-left"></i> Go Back
                </a>
            </div>

            <!-- Quick Links -->
            <div class="mt-12 pt-8 border-t border-gray-200 dark:border-gray-700">
                <p class="text-xs font-bold text-gray-400 dark:text-gray-500 uppercase tracking-widest mb-4">Quick Navigation</p>
                <div class="flex flex-wrap justify-center gap-4 text-sm">
                    <a href="#" class="text-gray-600 dark:text-gray-400 hover:text-primary dark:hover:text-green-400 transition">Ride Now</a>
                    <a href="#" class="text-gray-600 dark:text-gray-400 hover:text-primary dark:hover:text-green-400 transition">My Bookings</a>
                    <a href="#" class="text-gray-600 dark:text-gray-400 hover:text-primary dark:hover:text-green-400 transition">Support</a>
                    <a href="#" class="text-gray-600 dark:text-gray-400 hover:text-primary dark:hover:text-green-400 transition">About Us</a>
                </div>
            </div>

            <!-- Footer Note -->
            <p class="mt-8 text-xs text-gray-400 dark:text-gray-600">
                <i class="fas fa-bicycle text-secondary mr-1"></i> UrbanRide &bull; Always moving forward
            </p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 px-6 py-4 flex-shrink-0 transition-colors">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2 text-xs text-gray-500 dark:text-gray-400">
            <span>&copy; 2026 UrbanRide. All rights reserved.</span>
            <div class="flex gap-4">
                <a href="#" class="hover:text-primary dark:hover:text-green-400 transition">Privacy</a>
                <a href="#" class="hover:text-primary dark:hover:text-green-400 transition">Terms</a>
                <a href="#" class="hover:text-primary dark:hover:text-green-400 transition">Support</a>
            </div>
        </div>
    </footer>

    <!-- RTL support adjustment for icons -->
    <script>
        // Ensure RTL works properly with icons
        document.addEventListener('DOMContentLoaded', function() {
            const rtlBtn = document.querySelector('[onclick*="rtl"]');
            if (rtlBtn) {
                rtlBtn.addEventListener('click', function() {
                    // Update icon directions if needed
                    const backBtn = document.querySelector('a[onclick*="history.back"]');
                    if (backBtn) {
                        const icon = backBtn.querySelector('i');
                        if (document.body.classList.contains('rtl')) {
                            icon.className = 'fas fa-arrow-right';
                        } else {
                            icon.className = 'fas fa-arrow-left';
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
