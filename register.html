<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanRide - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#15803D',
                        secondary: '#F59E0B'
                    }
                }
            }
        }
    </script>

    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body class="bg-gray-50 dark:bg-gray-900 flex items-center justify-center min-h-screen py-12 font-sans transition-colors relative">

    <!-- Top Right Actions OUTSIDE the card -->
    <div class="fixed top-4 right-4 flex items-center gap-2 z-50">
        <button onclick="document.body.classList.toggle('rtl'); document.documentElement.setAttribute('dir', document.body.classList.contains('rtl') ? 'rtl' : 'ltr')" class="bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 text-xs font-bold px-3 py-2 rounded shadow-md hover:bg-gray-50 dark:hover:bg-gray-700 transition uppercase tracking-widest border border-gray-200 dark:border-gray-700">
            RTL
        </button>
        <button onclick="document.documentElement.classList.toggle('dark')" class="bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 w-10 h-10 rounded shadow-md flex items-center justify-center hover:bg-gray-50 dark:hover:bg-gray-700 transition border border-gray-200 dark:border-gray-700">
            <i class="fas fa-moon"></i>
        </button>
    </div>
    

    <div class="relative bg-white dark:bg-gray-800 w-full max-w-md rounded-lg shadow-2xl overflow-hidden border-t-4 border-primary transition-colors">
        
        <div class="p-10 text-center mt-2">
            <!-- Logo -->
            <a href="index.html" class="inline-flex items-center gap-2 mb-6 text-gray-900 dark:text-white transition-colors">
                <i class="fas fa-bicycle text-secondary text-3xl"></i>
                <span class="text-2xl font-extrabold tracking-widest uppercase">URBAN<span class="text-secondary">RIDE</span></span>
            </a>
            
            <h1 class="text-3xl font-extrabold text-gray-900 dark:text-white mb-2 transition-colors">Exclusive Access</h1>
            <p class="text-xs text-gray-500 dark:text-gray-400 uppercase tracking-widest font-bold mb-6 transition-colors">Register your private account</p>
            <div class="w-12 h-0.5 bg-primary mx-auto mb-8"></div>

            <form action="user-dashboard.html" class="text-left space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-900 dark:text-gray-300 uppercase tracking-wider mb-2 transition-colors">First Name</label>
                        <input type="text" class="w-full px-3 py-3 border border-gray-300 dark:border-gray-700 dark:bg-gray-900 rounded-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary uppercase text-sm tracking-wider placeholder-gray-400 dark:placeholder-gray-500 text-gray-800 dark:text-gray-200 font-medium transition-colors" placeholder="JAMES" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-900 dark:text-gray-300 uppercase tracking-wider mb-2 transition-colors">Last Name</label>
                        <input type="text" class="w-full px-3 py-3 border border-gray-300 dark:border-gray-700 dark:bg-gray-900 rounded-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary uppercase text-sm tracking-wider placeholder-gray-400 dark:placeholder-gray-500 text-gray-800 dark:text-gray-200 font-medium transition-colors" placeholder="BOND" required>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-900 dark:text-gray-300 uppercase tracking-wider mb-2 transition-colors">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-envelope text-gray-400 dark:text-gray-500"></i>
                        </div>
                        <input type="email" class="w-full pl-10 pr-3 py-3 border border-gray-300 dark:border-gray-700 dark:bg-gray-900 rounded-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary uppercase text-sm tracking-wider placeholder-gray-400 dark:placeholder-gray-500 text-gray-800 dark:text-gray-200 font-medium transition-colors" placeholder="RIDER@URBANRIDE.COM" required>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-900 dark:text-gray-300 uppercase tracking-wider mb-2 transition-colors">Secure Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-gray-400 dark:text-gray-500"></i>
                        </div>
                        <input type="password" class="w-full pl-10 pr-10 py-3 border border-gray-300 dark:border-gray-700 dark:bg-gray-900 rounded-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary uppercase text-sm tracking-wider placeholder-gray-400 dark:placeholder-gray-500 text-gray-800 dark:text-gray-200 font-medium transition-colors" placeholder="CREATE PASSWORD" required>
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300 transition-colors">
                            <i class="fas fa-eye"></i>
                        </div>
                    </div>
                </div>

                <button type="submit" class="w-full bg-primary text-white font-bold text-sm tracking-widest uppercase py-4 rounded hover:bg-green-800 transition shadow-md">
                    Register Account
                </button>
            </form>

            <div class="mt-8 flex items-center">
                <div class="flex-grow border-t border-gray-200 dark:border-gray-700 transition-colors"></div>
                <span class="px-4 text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest transition-colors">Or Authenticate With</span>
                <div class="flex-grow border-t border-gray-200 dark:border-gray-700 transition-colors"></div>
            </div>

            <div class="mt-6 grid grid-cols-3 gap-4">
                <a href="#" class="flex items-center justify-center py-3 border border-gray-200 dark:border-gray-700 rounded-md hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                    <i class="fab fa-google text-xl" style="color: #DB4437;"></i>
                </a>
                <a href="#" class="flex items-center justify-center py-3 border border-gray-200 dark:border-gray-700 rounded-md hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                    <i class="fab fa-apple text-xl text-black dark:text-white"></i>
                </a>
                <a href="#" class="flex items-center justify-center py-3 border border-gray-200 dark:border-gray-700 rounded-md hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                    <i class="fab fa-facebook text-xl text-blue-600"></i>
                </a>
            </div>

            <div class="mt-10 text-xs font-bold tracking-widest uppercase text-gray-500 dark:text-gray-400 transition-colors">
                Already a Member? <a href="login.html" class="text-primary hover:text-green-800 dark:hover:text-green-500 transition ml-1">Sign In</a>
            </div>
        </div>
    </div>


    

    <!-- Active Link Highlight Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const currentPath = window.location.pathname.split('/').pop() || 'index.html';
            
            // Highlight Desktop Links
            const desktopLinks = document.querySelectorAll('.hidden.xl\\:flex > a, .hidden.xl\\:flex .group a');
            desktopLinks.forEach(link => {
                const href = link.getAttribute('href');
                if (href === currentPath) {
                    link.classList.remove('text-gray-700', 'dark:text-gray-300');
                    // Add secondary color highlight
                    link.classList.add('text-secondary', 'dark:text-secondary');
                    // Add bottom border for visual active state
                    link.style.borderBottom = '2px solid #F59E0B'; // secondary color
                    
                    // If it's in a dropdown, highlight the parent button too
                    const parentGroup = link.closest('.group');
                    if(parentGroup) {
                        const parentBtn = parentGroup.querySelector('button');
                        if(parentBtn) {
                            parentBtn.classList.remove('text-gray-700', 'dark:text-gray-300');
                            parentBtn.classList.add('text-secondary', 'dark:text-secondary');
                            parentBtn.style.borderBottom = '2px solid #F59E0B';
                        }
                    }
                }
            });

            // Highlight Mobile Links
            const mobileLinks = document.querySelectorAll('#mobile-menu-content a');
            mobileLinks.forEach(link => {
                const href = link.getAttribute('href');
                if (href === currentPath) {
                    link.classList.remove('text-gray-800', 'dark:text-gray-200');
                    link.classList.add('text-secondary', 'dark:text-secondary');
                    link.style.borderLeft = '4px solid #F59E0B';
                    link.style.paddingLeft = '8px';
                }
            });
        });
    </script>

</body>
</html>
